# Keeps the Render free-tier API awake (it sleeps after 15 min idle).
# GitHub cron is UTC: 00:00–19:59 UTC ≈ 05:30–01:30 IST; 01:30–05:30 IST is left idle so Render can sleep.
# Offset from :00 because GitHub delays top-of-hour schedules most.
name: keep-alive

on:
  schedule:
    - cron: '2-59/5 0-19 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 https://ayas-operations-api.onrender.com/actuator/health
